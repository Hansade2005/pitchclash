<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2340"/><stop offset="1" stop-color="#06080f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff06a"/><stop offset="0.45" stop-color="#ffc21f"/><stop offset="1" stop-color="#ff5a12"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd84a"/><stop offset="1" stop-color="#ff5a12"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#35f0ff" stop-opacity="0"/><stop offset="0.25" stop-color="#35f0ff"/><stop offset="1" stop-color="#eaffff"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><path d="M256 22 L462 118 V314 Q462 420 256 492 Q50 420 50 314 V118 Z"/></clipPath>
  </defs>
  <!-- shield -->
  <path d="M256 22 L462 118 V314 Q462 420 256 492 Q50 420 50 314 V118 Z" fill="url(#bg)" stroke="url(#rim)" stroke-width="16" stroke-linejoin="round"/>
  <g clip-path="url(#clip)">
    <!-- road perspective lines -->
    <path d="M256 250 L96 500 M256 250 L416 500" stroke="#2c3760" stroke-width="6"/>
    <path d="M256 300 V330 M256 356 V398 M256 430 V490" stroke="#2c3760" stroke-width="8"/>
    <!-- apex: the A -->
    <path d="M256 78 L420 404 H336 L256 236 L176 404 H92 Z" fill="url(#gold)" stroke="#3a1300" stroke-width="5" stroke-linejoin="round"/>
    <path d="M256 78 L420 404 H336 L256 236 Z" fill="#000" opacity="0.16"/>
    <!-- clash: speed bolt through the A -->
    <g filter="url(#glow)"><path d="M40 372 L372 296 L340 334 L476 300 L150 398 L186 356 Z" fill="url(#cy)"/></g>
  </g>
</svg>
